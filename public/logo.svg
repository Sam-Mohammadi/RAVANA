<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Soft background glow for the synaptic node -->
    <radialGradient id="synapseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Navy gradient for main neural body -->
    <linearGradient id="navyStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c4c" />
      <stop offset="50%" stop-color="#0f233d" />
      <stop offset="100%" stop-color="#163863" />
    </linearGradient>

    <!-- Teal/Cyan gradient for secondary synaptic loop -->
    <linearGradient id="tealStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>

    <!-- Drop shadow for refined depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="16" />

  <g transform="translate(0, 10)">
    <!-- ==================== LOGO ICON: THE NEURAL "R" ==================== -->
    <g id="ravana-mark">
      <!-- Synaptic Glow Field -->
      <circle cx="400" cy="195" r="75" fill="url(#synapseGlow)" />

      <!-- Lower Right Teal Synaptic Loop (Tilted loop of the R leg) -->
      <path 
        d="M 370 230 C 390 280, 485 270, 475 220 C 465 175, 415 190, 375 230 Z" 
        fill="none" 
        stroke="url(#tealStroke)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
      />

      <!-- Lower Left Navy Loop (Graceful tail of the R) -->
      <path 
        d="M 390 220 C 370 245, 335 285, 305 265 C 280 245, 310 215, 350 205" 
        fill="none" 
        stroke="url(#navyStroke)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
      />

      <!-- Main Upper Body of 'R' (Head loop & neural dendrite pathways) -->
      <path 
        d="M 345 95 
           C 425 90, 470 120, 470 170 
           C 470 225, 400 240, 360 225 
           C 310 205, 300 135, 360 100 
           C 410 70, 440 145, 395 195" 
        fill="none" 
        stroke="url(#navyStroke)" 
        stroke-width="17" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
      />

      <!-- Internal neural connection line crossing center -->
      <path 
        d="M 345 105 C 410 125, 430 160, 400 195 C 375 220, 345 230, 330 250" 
        fill="none" 
        stroke="url(#navyStroke)" 
        stroke-width="15" 
        stroke-linecap="round" 
      />

      <!-- Synaptic Core Nucleus (Orange node) -->
      <circle cx="400" cy="195" r="14" fill="#f97316" />
      <circle cx="400" cy="195" r="9" fill="#ffedd5" opacity="0.4" />
    </g>

    <!-- ==================== TYPOGRAPHY ==================== -->
    <!-- Primary Logotype: RAVĀNA -->
    <g id="ravana-text" transform="translate(400, 380)">
      <text 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="78" 
        letter-spacing="9" 
        fill="#0f233d"
      >
        RAVĀNA
      </text>

      <!-- Macron line over the letter A (centered over the Ā) -->
      <!-- In 'RAVĀNA', the 4th letter is Ā -->
      <rect x="22" y="-98" width="44" height="7" rx="3.5" fill="#0f233d" />

      <!-- Subtitle: AI-POWERED CLINICAL TRAINING -->
      <text 
        y="50" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-weight="600" 
        font-size="19" 
        letter-spacing="5" 
        fill="#1e3a5f"
      >
        AI-POWERED CLINICAL TRAINING
      </text>

      <!-- Persian Platform Label: سامانه هوشمند شبیه‌ساز بالینی روان‌درمانی -->
      <text 
        y="95" 
        text-anchor="middle" 
        font-family="'Vazirmatn', system-ui, sans-serif" 
        font-weight="500" 
        font-size="16" 
        fill="#64748b"
      >
        سامانه هوشمند آموزش و شبیه‌سازی بالینی روان‌درمانی
      </text>
    </g>
  </g>
</svg>
